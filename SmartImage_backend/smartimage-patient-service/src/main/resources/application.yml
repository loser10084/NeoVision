server:
  port: 8083
  tomcat:
    max-http-form-post-size: 500MB
    max-swallow-size: -1

spring:
  application:
    name: smartimage-patient-service
  main:
    allow-circular-references: true
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:3306/smart_image?serverTimezone=Asia/Shanghai&useUnicode=true&characterEncoding=utf-8&zeroDateTimeBehavior=convertToNull&useSSL=false&allowPublicKeyRetrieval=true
    username: root
    password: 12345
  data:
    redis:
      host: localhost
      port: 6379
  servlet:
    multipart:
      max-file-size: 500MB
      max-request-size: 500MB
  cloud:
    inetutils:
      preferred-ip-address: 127.0.0.1
    nacos:
      discovery:
        server-addr: localhost:8848
        ip: 127.0.0.1

mybatis:
  mapper-locations: classpath:mapper/*.xml
  type-aliases-package: com.yunchuan.smartimage_backend.entity
  configuration:
    map-underscore-to-camel-case: true

logging:
  level:
    com:
      yunchuan:
        smartimage_backend: info

