<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no" />
  <title>3D Viewer</title>
  <style>
    :root {
      --mi-primary: #2f78d8;
      --mi-primary-strong: #245eac;
      --mi-primary-soft: #eaf3ff;
      --mi-text-main: #143356;
      --mi-text-regular: #2f4f73;
      --mi-text-muted: #6a84a6;
      --mi-bg: #edf4ff;
      --mi-border: #d6e5f7;
      --mi-border-strong: #bfd5ef;
      --mi-shadow: 0 10px 26px rgba(45, 113, 194, 0.12);
      --mi-radius-card: 14px;
      --mi-radius-pill: 999px;
    }

    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      color: var(--mi-text-main);
      background:
        radial-gradient(220px 120px at -4% -6%, rgba(136, 186, 255, 0.22), transparent 70%),
        radial-gradient(190px 120px at 104% 2%, rgba(168, 207, 255, 0.2), transparent 64%),
        linear-gradient(180deg, #f4f8ff 0%, #edf4ff 36%, #e9f2ff 100%);
      background-color: var(--mi-bg);
      overflow: auto;
      -webkit-overflow-scrolling: touch;
      font-family: "Avenir Next", "PingFang SC", "Noto Sans SC", "Microsoft YaHei", sans-serif;
      letter-spacing: 0.1px;
      -webkit-font-smoothing: antialiased;
    }

    .page {
      min-height: 100%;
      padding: 16px 14px 14px;
      box-sizing: border-box;
    }

    .card {
      background: #fff;
      border: 1px solid var(--mi-border);
      border-radius: var(--mi-radius-card);
      padding: 14px;
      margin-bottom: 12px;
      box-shadow: var(--mi-shadow);
      box-sizing: border-box;
    }

    .section-title {
      font-size: 17px;
      font-weight: 650;
      color: var(--mi-text-main);
      letter-spacing: 0.2px;
    }

    .tips {
      margin-top: 8px;
      color: var(--mi-text-muted);
      font-size: 13px;
    }

    .gl-wrap {
      position: relative;
      width: 100%;
      height: 46vh;
      min-height: 270px;
      border-radius: 12px;
      border: 1px solid #cfdef4;
      background: radial-gradient(circle at top, #ffffff 0%, #eef4ff 50%, #e6f0ff 100%);
      overflow: hidden;
      margin-top: 10px;
      box-sizing: border-box;
    }

    #gl {
      width: 100%;
      height: 100%;
      display: block;
      touch-action: none;
    }

    .controls {
      margin-top: 14px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .control-row {
      display: grid;
      grid-template-columns: 72px 1fr 62px;
      gap: 8px;
      align-items: center;
      font-size: 13px;
      color: #1f2e44;
    }

    .control-row input[type="range"] {
      width: 100%;
      height: 22px;
      appearance: none;
      background: transparent;
    }

    .control-row input[type="range"]::-webkit-slider-runnable-track {
      height: 5px;
      border-radius: 999px;
      background: linear-gradient(90deg, #d6e5f7 0%, #c6dbf6 100%);
    }

    .control-row input[type="range"]::-webkit-slider-thumb {
      appearance: none;
      width: 16px;
      height: 16px;
      margin-top: -5px;
      border-radius: 50%;
      border: 2px solid #fff;
      box-shadow: 0 2px 7px rgba(47, 120, 216, 0.28);
      background: linear-gradient(135deg, var(--mi-primary) 0%, var(--mi-primary-strong) 100%);
    }

    .control-value {
      text-align: right;
      color: var(--mi-text-muted);
      font-variant-numeric: tabular-nums;
    }

    .action-bar {
      margin-top: 12px;
      display: flex;
      gap: 10px;
    }

    .action-btn {
      flex: 1;
      border: 1px solid var(--mi-border);
      background: #fff;
      color: var(--mi-text-regular);
      border-radius: var(--mi-radius-pill);
      padding: 9px 0;
      font-size: 14px;
      font-weight: 520;
    }

    .action-btn:active {
      opacity: 0.78;
    }
  </style>
</head>
<body>
  <div id="app" class="page">
    <div class="card">
      <div class="section-title">3D重建</div>
      <div class="tips">手势：拖动旋转，滚轮/双指缩放。</div>
    </div>

    <div class="card">
      <div class="section-title">三维查看</div>
      <div id="glwrap" class="gl-wrap">
        <canvas id="gl"></canvas>
      </div>

      <div class="controls">
        <div class="control-row">
          <span>阈值</span>
          <input id="thresholdInput" type="range" min="0" max="100" step="1" value="10" />
          <span id="thresholdValue" class="control-value">10%</span>
        </div>
        <div class="control-row">
          <span>点大小</span>
          <input id="pointSizeInput" type="range" min="1" max="8" step="1" value="4" />
          <span id="pointSizeValue" class="control-value">4</span>
        </div>
        <div class="control-row">
          <span>不透明度</span>
          <input id="alphaInput" type="range" min="5" max="80" step="1" value="25" />
          <span id="alphaValue" class="control-value">25%</span>
        </div>
        <div class="control-row">
          <span>最大点数</span>
          <input id="maxPointsInput" type="range" min="20000" max="400000" step="20000" value="300000" />
          <span id="maxPointsValue" class="control-value">300000</span>
        </div>
      </div>

      <div class="action-bar">
        <button id="btnRebuild" class="action-btn" type="button">重建</button>
        <button id="btnReset" class="action-btn" type="button">重置视角</button>
      </div>
    </div>
  </div>

  <script>
    const statusEl = document.getElementById('status')
    const canvas = document.getElementById('gl')
    const glWrap = document.getElementById('glwrap')
    const thresholdInput = document.getElementById('thresholdInput')
    const thresholdValue = document.getElementById('thresholdValue')
    const pointSizeInput = document.getElementById('pointSizeInput')
    const pointSizeValue = document.getElementById('pointSizeValue')
    const alphaInput = document.getElementById('alphaInput')
    const alphaValue = document.getElementById('alphaValue')
    const maxPointsInput = document.getElementById('maxPointsInput')
    const maxPointsValue = document.getElementById('maxPointsValue')
    const btnRebuild = document.getElementById('btnRebuild')
    const btnReset = document.getElementById('btnReset')

    const state = {
      gl: null,
      program: null,
      pointBuffer: null,
      pointCount: 0,
      rotationX: 0.3,
      rotationY: 0.6,
      zoom: 2.8,
      pointSize: 4,
      brainAlpha: 0.25,
      thresholdPercent: 10,
      maxPoints: 300000,
      volumeData: null,
      labelData: null,
      dragging: false,
      lastX: 0,
      lastY: 0,
      lastPinch: 0
    }

    const NRRD_TYPES = {
      'uchar': { bytes: 1, ctor: Uint8Array }, 'unsigned char': { bytes: 1, ctor: Uint8Array }, 'uint8': { bytes: 1, ctor: Uint8Array },
      'int8': { bytes: 1, ctor: Int8Array }, 'short': { bytes: 2, ctor: Int16Array }, 'short int': { bytes: 2, ctor: Int16Array },
      'int16': { bytes: 2, ctor: Int16Array }, 'ushort': { bytes: 2, ctor: Uint16Array }, 'unsigned short': { bytes: 2, ctor: Uint16Array },
      'uint16': { bytes: 2, ctor: Uint16Array }, 'int': { bytes: 4, ctor: Int32Array }, 'int32': { bytes: 4, ctor: Int32Array },
      'uint': { bytes: 4, ctor: Uint32Array }, 'uint32': { bytes: 4, ctor: Uint32Array }, 'float': { bytes: 4, ctor: Float32Array },
      'double': { bytes: 8, ctor: Float64Array }
    }

    function setStatus(msg) {
      if (statusEl) statusEl.textContent = msg
      try { console.log('[3d-viewer]', msg) } catch (_) {}
    }
    function clamp(v, min, max) { return Math.max(min, Math.min(max, v)) }
    function pinchDist(event) {
      const dx = event.touches[0].clientX - event.touches[1].clientX
      const dy = event.touches[0].clientY - event.touches[1].clientY
      return Math.sqrt(dx * dx + dy * dy)
    }

    function parseQuery() {
      const q = new URLSearchParams(location.search || '')
      return {
        studyId: q.get('studyId') || '',
        view: String(q.get('view') || 'both').toLowerCase(),
        volumeUrl: q.get('volumeUrl') || '',
        labelUrl: q.get('labelUrl') || '',
        gatewayUrl: (q.get('gatewayUrl') || '').replace(/\/+$/, ''),
        modelUrl: (q.get('modelUrl') || '').replace(/\/+$/, ''),
        token: q.get('token') || ''
      }
    }

    function absUrl(raw, base) {
      if (!raw) return ''
      if (/^https?:\/\//i.test(raw)) return raw
      if (!base) return raw
      return raw.startsWith('/') ? (base + raw) : (base + '/' + raw)
    }

    async function fetchJson(url, token) {
      const headers = token ? { Authorization: 'Bearer ' + token } : {}
      const resp = await fetch(url, { headers })
      if (!resp.ok) throw new Error('HTTP ' + resp.status)
      return resp.json()
    }

    async function fetchBuffer(url, token) {
      const headers = token ? { Authorization: 'Bearer ' + token } : {}
      const resp = await fetch(url, { headers })
      if (!resp.ok) throw new Error('HTTP ' + resp.status)
      return resp.arrayBuffer()
    }

    function findHeaderEnd(bytes) {
      for (let i = 0; i < bytes.length - 1; i += 1) {
        if (bytes[i] === 10 && bytes[i + 1] === 10) return i + 2
        if (i < bytes.length - 3 && bytes[i] === 13 && bytes[i+1] === 10 && bytes[i+2] === 13 && bytes[i+3] === 10) return i + 4
      }
      return -1
    }

    function parseHeader(text) {
      const header = {}
      const lines = text.split(/\r?\n/)
      lines.forEach((line, idx) => {
        const s = line.trim()
        if (!s || s.startsWith('#')) return
        if (idx === 0 && s.startsWith('NRRD')) { header._magic = s; return }
        const p = s.indexOf(':')
        if (p < 0) return
        header[s.slice(0, p).trim().toLowerCase()] = s.slice(p + 1).trim()
      })
      return header
    }

    function isLittleEndian() { return new Uint8Array(new Uint16Array([1]).buffer)[0] === 1 }

    function swapBytes(bytes, bytesPerElement, count) {
      for (let i = 0; i < count; i += 1) {
        const offset = i * bytesPerElement
        for (let j = 0; j < bytesPerElement / 2; j += 1) {
          const a = offset + j, b = offset + bytesPerElement - 1 - j
          const tmp = bytes[a]; bytes[a] = bytes[b]; bytes[b] = tmp
        }
      }
    }

    async function decompress(payload) {
      if (typeof DecompressionStream === 'undefined') {
        throw new Error('DecompressionStream not supported')
      }
      const formats = ['deflate', 'gzip']
      let last = null
      for (let i = 0; i < formats.length; i += 1) {
        try {
          const stream = new Response(new Blob([payload]).stream().pipeThrough(new DecompressionStream(formats[i])))
          const buffer = await stream.arrayBuffer()
          return new Uint8Array(buffer)
        } catch (e) {
          last = e
        }
      }
      throw last || new Error('decompress failed')
    }

    async function parseNrrd(buffer) {
      const bytes = new Uint8Array(buffer)
      const headerEnd = findHeaderEnd(bytes)
      if (headerEnd < 0) throw new Error('NRRD header not found')
      const header = parseHeader(new TextDecoder('utf-8').decode(bytes.slice(0, headerEnd)))
      if (!header._magic || !header._magic.startsWith('NRRD')) throw new Error('Invalid NRRD')

      const dims = (String(header.sizes || header.size || '').match(/-?\d+(?:\.\d+)?/g) || []).map(Number)
      if (dims.length < 3 || dims.some((v) => Number.isNaN(v))) throw new Error('Invalid sizes')

      const typeInfo = NRRD_TYPES[String(header.type || '').toLowerCase()]
      if (!typeInfo) throw new Error('Unsupported type: ' + header.type)

      let payload = bytes.slice(headerEnd)
      const encoding = String(header.encoding || 'raw').toLowerCase()
      const isAscii = encoding === 'ascii' || encoding === 'txt' || encoding === 'text'
      if (!isAscii && (encoding === 'gzip' || encoding === 'gz' || encoding === 'deflate')) {
        payload = await decompress(payload)
      } else if (!isAscii && encoding !== 'raw') {
        throw new Error('Unsupported encoding: ' + encoding)
      }

      const voxelCount = dims[0] * dims[1] * dims[2]
      if (isAscii) {
        const tokens = new TextDecoder('utf-8').decode(payload).trim().split(/\s+/)
        if (tokens.length < voxelCount) throw new Error('Payload too short')
        const typed = new typeInfo.ctor(voxelCount)
        for (let i = 0; i < voxelCount; i += 1) typed[i] = Number(tokens[i])
        return summarize(typed, dims)
      }

      const expectedBytes = voxelCount * typeInfo.bytes
      if (payload.byteLength < expectedBytes) throw new Error('Payload too short')
      const endian = String(header.endian || 'little').toLowerCase()
      const chunk = payload.slice(0, expectedBytes)
      if (typeInfo.bytes > 1) {
        if ((endian === 'big' && isLittleEndian()) || (endian === 'little' && !isLittleEndian())) {
          swapBytes(chunk, typeInfo.bytes, voxelCount)
        }
      }
      const typed = new typeInfo.ctor(chunk.buffer, chunk.byteOffset, voxelCount)
      return summarize(typed, dims)
    }

    function summarize(values, dims) {
      let min = Number.POSITIVE_INFINITY, max = Number.NEGATIVE_INFINITY
      for (let i = 0; i < values.length; i += 1) {
        const v = values[i]; if (v < min) min = v; if (v > max) max = v
      }
      return { values, dims, min, max }
    }

    function initGL() {
      const gl = canvas.getContext('webgl', { antialias: true, preserveDrawingBuffer: true })
      if (!gl) throw new Error('WebGL unavailable')

      const vs = `attribute vec3 aPosition;attribute float aIntensity;attribute float aLabel;uniform mat4 uMvp;uniform float uPointSize;varying float vLabel;varying float vIntensity;void main(){gl_Position=uMvp*vec4(aPosition,1.0);gl_PointSize=uPointSize;vLabel=aLabel;vIntensity=aIntensity;}`
      const fs = `precision mediump float;varying float vLabel;varying float vIntensity;uniform int uPass;uniform float uBrainAlpha;vec3 lc(float x){if(x<1.5)return vec3(1.0,0.2,0.2);if(x<2.5)return vec3(0.0,0.9,1.0);if(x<3.5)return vec3(1.0,0.95,0.0);return vec3(0.9,0.0,1.0);}void main(){if(uPass==1){if(vLabel<0.5)discard;gl_FragColor=vec4(lc(vLabel),1.0);}else{if(vLabel>0.5)discard;float a=clamp(uBrainAlpha*(0.35+0.65*vIntensity),0.05,0.95);gl_FragColor=vec4(0.0,0.0,0.0,a);}}`

      function shader(type, src) {
        const s = gl.createShader(type)
        gl.shaderSource(s, src)
        gl.compileShader(s)
        if (!gl.getShaderParameter(s, gl.COMPILE_STATUS)) throw new Error(gl.getShaderInfoLog(s) || 'shader compile failed')
        return s
      }

      const program = gl.createProgram()
      gl.attachShader(program, shader(gl.VERTEX_SHADER, vs))
      gl.attachShader(program, shader(gl.FRAGMENT_SHADER, fs))
      gl.linkProgram(program)
      if (!gl.getProgramParameter(program, gl.LINK_STATUS)) throw new Error(gl.getProgramInfoLog(program) || 'program link failed')

      gl.useProgram(program)
      gl.enable(gl.DEPTH_TEST)
      gl.depthFunc(gl.LEQUAL)
      gl.enable(gl.BLEND)
      gl.blendFunc(gl.SRC_ALPHA, gl.ONE_MINUS_SRC_ALPHA)
      gl.clearColor(0.98, 0.98, 0.99, 1)

      state.gl = gl
      state.program = program
      state.pointBuffer = gl.createBuffer()
    }

    function mat4Create() {
      const out = new Float32Array(16)
      out[0] = 1
      out[5] = 1
      out[10] = 1
      out[15] = 1
      return out
    }

    function mat4Perspective(out, fovy, aspect, near, far) {
      const f = 1 / Math.tan(fovy / 2)
      const nf = 1 / (near - far)
      out[0] = f / aspect
      out[1] = 0
      out[2] = 0
      out[3] = 0
      out[4] = 0
      out[5] = f
      out[6] = 0
      out[7] = 0
      out[8] = 0
      out[9] = 0
      out[10] = (far + near) * nf
      out[11] = -1
      out[12] = 0
      out[13] = 0
      out[14] = (2 * far * near) * nf
      out[15] = 0
      return out
    }

    function mat4Translate(out, a, v) {
      const x = v[0], y = v[1], z = v[2]
      if (a === out) {
        out[12] = a[0] * x + a[4] * y + a[8] * z + a[12]
        out[13] = a[1] * x + a[5] * y + a[9] * z + a[13]
        out[14] = a[2] * x + a[6] * y + a[10] * z + a[14]
        out[15] = a[3] * x + a[7] * y + a[11] * z + a[15]
      } else {
        const a00 = a[0], a01 = a[1], a02 = a[2], a03 = a[3]
        const a10 = a[4], a11 = a[5], a12 = a[6], a13 = a[7]
        const a20 = a[8], a21 = a[9], a22 = a[10], a23 = a[11]
        out[0] = a00; out[1] = a01; out[2] = a02; out[3] = a03
        out[4] = a10; out[5] = a11; out[6] = a12; out[7] = a13
        out[8] = a20; out[9] = a21; out[10] = a22; out[11] = a23
        out[12] = a00 * x + a10 * y + a20 * z + a[12]
        out[13] = a01 * x + a11 * y + a21 * z + a[13]
        out[14] = a02 * x + a12 * y + a22 * z + a[14]
        out[15] = a03 * x + a13 * y + a23 * z + a[15]
      }
      return out
    }

    function mat4RotateX(out, a, rad) {
      const s = Math.sin(rad)
      const c = Math.cos(rad)
      const a10 = a[4], a11 = a[5], a12 = a[6], a13 = a[7]
      const a20 = a[8], a21 = a[9], a22 = a[10], a23 = a[11]
      if (a !== out) {
        out[0] = a[0]; out[1] = a[1]; out[2] = a[2]; out[3] = a[3]
        out[12] = a[12]; out[13] = a[13]; out[14] = a[14]; out[15] = a[15]
      }
      out[4] = a10 * c + a20 * s
      out[5] = a11 * c + a21 * s
      out[6] = a12 * c + a22 * s
      out[7] = a13 * c + a23 * s
      out[8] = a20 * c - a10 * s
      out[9] = a21 * c - a11 * s
      out[10] = a22 * c - a12 * s
      out[11] = a23 * c - a13 * s
      return out
    }

    function mat4RotateY(out, a, rad) {
      const s = Math.sin(rad)
      const c = Math.cos(rad)
      const a00 = a[0], a01 = a[1], a02 = a[2], a03 = a[3]
      const a20 = a[8], a21 = a[9], a22 = a[10], a23 = a[11]
      if (a !== out) {
        out[4] = a[4]; out[5] = a[5]; out[6] = a[6]; out[7] = a[7]
        out[12] = a[12]; out[13] = a[13]; out[14] = a[14]; out[15] = a[15]
      }
      out[0] = a00 * c - a20 * s
      out[1] = a01 * c - a21 * s
      out[2] = a02 * c - a22 * s
      out[3] = a03 * c - a23 * s
      out[8] = a00 * s + a20 * c
      out[9] = a01 * s + a21 * c
      out[10] = a02 * s + a22 * c
      out[11] = a03 * s + a23 * c
      return out
    }

    function resize() {
      const dpr = window.devicePixelRatio || 1
      const rect = glWrap ? glWrap.getBoundingClientRect() : null
      const w = Math.max(1, Math.floor((rect && rect.width) ? rect.width : (window.innerWidth || 320)))
      const h = Math.max(1, Math.floor((rect && rect.height) ? rect.height : (window.innerHeight || 320)))
      canvas.width = Math.floor(w * dpr)
      canvas.height = Math.floor(h * dpr)
      canvas.style.width = w + 'px'
      canvas.style.height = h + 'px'
      if (state.gl) state.gl.viewport(0, 0, canvas.width, canvas.height)
      render()
    }

    function render() {
      const gl = state.gl, p = state.program
      if (!gl || !p || !state.pointCount) return
      gl.useProgram(p)
      gl.clear(gl.COLOR_BUFFER_BIT | gl.DEPTH_BUFFER_BIT)
      gl.bindBuffer(gl.ARRAY_BUFFER, state.pointBuffer)

      const positionLoc = gl.getAttribLocation(p, 'aPosition')
      const intensityLoc = gl.getAttribLocation(p, 'aIntensity')
      const labelLoc = gl.getAttribLocation(p, 'aLabel')
      if (positionLoc >= 0) {
        gl.enableVertexAttribArray(positionLoc)
        gl.vertexAttribPointer(positionLoc, 3, gl.FLOAT, false, 20, 0)
      }
      if (intensityLoc >= 0) {
        gl.enableVertexAttribArray(intensityLoc)
        gl.vertexAttribPointer(intensityLoc, 1, gl.FLOAT, false, 20, 12)
      }
      if (labelLoc >= 0) {
        gl.enableVertexAttribArray(labelLoc)
        gl.vertexAttribPointer(labelLoc, 1, gl.FLOAT, false, 20, 16)
      }

      const aspect = canvas.width / canvas.height
      const mvp = mat4Create()
      mat4Perspective(mvp, 0.9, aspect, 0.1, 100)
      mat4Translate(mvp, mvp, [0, 0, -state.zoom])
      mat4RotateX(mvp, mvp, state.rotationX)
      mat4RotateY(mvp, mvp, state.rotationY)

      gl.uniformMatrix4fv(gl.getUniformLocation(p, 'uMvp'), false, mvp)
      gl.uniform1f(gl.getUniformLocation(p, 'uPointSize'), Math.max(state.pointSize, 4))
      gl.uniform1f(gl.getUniformLocation(p, 'uBrainAlpha'), state.brainAlpha)

      gl.depthMask(true)
      gl.uniform1i(gl.getUniformLocation(p, 'uPass'), 1)
      gl.drawArrays(gl.POINTS, 0, state.pointCount)
      gl.depthMask(false)
      gl.uniform1i(gl.getUniformLocation(p, 'uPass'), 0)
      gl.drawArrays(gl.POINTS, 0, state.pointCount)
      gl.depthMask(true)
    }

    function buildCloud(volume, label) {
      const values = volume.values, dims = volume.dims
      const min = volume.min, max = volume.max
      const threshold = min + (state.thresholdPercent / 100) * ((max - min) || 1)
      const labelValues = label && label.values
      const hasLabel = !!(labelValues && label.dims.every((v, i) => v === dims[i]))

      const total = values.length
      let above = 0, labelCount = 0
      for (let i = 0; i < total; i += 1) {
        if (values[i] > threshold) above += 1
        if (hasLabel && labelValues[i] > 0) labelCount += 1
      }

      const maxPoints = state.maxPoints
      const labelBudget = Math.max(Math.floor(maxPoints * 0.25), 20000)
      const labelStride = labelCount > labelBudget ? Math.ceil(labelCount / labelBudget) : 1
      const labelTarget = Math.ceil(labelCount / labelStride)
      const brainBudget = Math.max(maxPoints - labelTarget, Math.floor(maxPoints * 0.5))
      const brainStride = above > brainBudget ? Math.ceil(above / brainBudget) : 1
      const targetCount = Math.ceil(above / brainStride) + labelTarget

      const data = new Float32Array(targetCount * 5)
      const maxDim = Math.max(dims[0], dims[1], dims[2])
      const scaleX = dims[0] / maxDim, scaleY = dims[1] / maxDim, scaleZ = dims[2] / maxDim
      const slice = dims[0] * dims[1]
      const range = (max - min) || 1
      const dx = Math.max(dims[0] - 1, 1), dy = Math.max(dims[1] - 1, 1), dz = Math.max(dims[2] - 1, 1)

      let seen = 0, seenLabel = 0, write = 0
      for (let i = 0; i < total; i += 1) {
        const v = values[i]
        if (v > threshold) {
          if (seen % brainStride === 0) {
            const z = Math.floor(i / slice)
            const rem = i - z * slice
            const y = Math.floor(rem / dims[0])
            const x = rem - y * dims[0]
            data[write] = (x / dx - 0.5) * scaleX
            data[write + 1] = -(y / dy - 0.5) * scaleY
            data[write + 2] = (z / dz - 0.5) * scaleZ
            data[write + 3] = (v - min) / range
            data[write + 4] = 0
            write += 5
          }
          seen += 1
        }
        if (hasLabel && labelValues[i] > 0) {
          if (seenLabel % labelStride === 0) {
            const z = Math.floor(i / slice)
            const rem = i - z * slice
            const y = Math.floor(rem / dims[0])
            const x = rem - y * dims[0]
            data[write] = (x / dx - 0.5) * scaleX
            data[write + 1] = -(y / dy - 0.5) * scaleY
            data[write + 2] = (z / dz - 0.5) * scaleZ
            data[write + 3] = 1
            data[write + 4] = labelValues[i]
            write += 5
          }
          seenLabel += 1
        }
      }

      const gl = state.gl
      gl.bindBuffer(gl.ARRAY_BUFFER, state.pointBuffer)
      gl.bufferData(gl.ARRAY_BUFFER, data.subarray(0, write), gl.STATIC_DRAW)
      state.pointCount = write / 5
      render()
    }

    function bindControls() {
      function syncControlValues() {
        thresholdInput.value = String(state.thresholdPercent)
        thresholdValue.textContent = state.thresholdPercent + '%'
        pointSizeInput.value = String(state.pointSize)
        pointSizeValue.textContent = String(state.pointSize)
        const alphaPercent = Math.round(state.brainAlpha * 100)
        alphaInput.value = String(alphaPercent)
        alphaValue.textContent = alphaPercent + '%'
        maxPointsInput.value = String(state.maxPoints)
        maxPointsValue.textContent = String(state.maxPoints)
      }

      thresholdInput.addEventListener('input', () => {
        state.thresholdPercent = Number(thresholdInput.value)
        thresholdValue.textContent = state.thresholdPercent + '%'
      })
      thresholdInput.addEventListener('change', () => {
        if (state.volumeData) buildCloud(state.volumeData, state.labelData)
      })

      pointSizeInput.addEventListener('input', () => {
        state.pointSize = Number(pointSizeInput.value)
        pointSizeValue.textContent = String(state.pointSize)
        render()
      })

      alphaInput.addEventListener('input', () => {
        const alphaPercent = Number(alphaInput.value)
        state.brainAlpha = alphaPercent / 100
        alphaValue.textContent = alphaPercent + '%'
        render()
      })

      maxPointsInput.addEventListener('input', () => {
        state.maxPoints = Number(maxPointsInput.value)
        maxPointsValue.textContent = String(state.maxPoints)
      })
      maxPointsInput.addEventListener('change', () => {
        if (state.volumeData) buildCloud(state.volumeData, state.labelData)
      })

      btnRebuild.addEventListener('click', () => {
        if (state.volumeData) buildCloud(state.volumeData, state.labelData)
      })

      btnReset.addEventListener('click', () => {
        state.rotationX = 0.3
        state.rotationY = 0.6
        state.zoom = 2.8
        render()
      })

      syncControlValues()
    }

    function bindEvents() {
      canvas.addEventListener('mousedown', (e) => { state.dragging = true; state.lastX = e.clientX; state.lastY = e.clientY })
      canvas.addEventListener('mousemove', (e) => {
        if (!state.dragging) return
        const dx = e.clientX - state.lastX, dy = e.clientY - state.lastY
        state.lastX = e.clientX; state.lastY = e.clientY
        state.rotationY += dx * 0.01
        state.rotationX += dy * 0.01
        render()
      })
      const stopDrag = () => { state.dragging = false }
      canvas.addEventListener('mouseup', stopDrag)
      canvas.addEventListener('mouseleave', stopDrag)
      canvas.addEventListener('wheel', (e) => {
        e.preventDefault()
        const delta = Math.sign(e.deltaY)
        state.zoom = clamp(state.zoom + delta * 0.12, 1.0, 6.0)
        render()
      }, { passive: false })
      canvas.addEventListener('touchstart', (e) => {
        e.preventDefault()
        if (e.touches.length === 1) {
          state.dragging = true
          state.lastX = e.touches[0].clientX
          state.lastY = e.touches[0].clientY
        } else if (e.touches.length === 2) {
          state.dragging = false
          state.lastPinch = pinchDist(e)
        }
      }, { passive: false })
      canvas.addEventListener('touchmove', (e) => {
        e.preventDefault()
        if (e.touches.length === 1 && state.dragging) {
          const dx = e.touches[0].clientX - state.lastX
          const dy = e.touches[0].clientY - state.lastY
          state.lastX = e.touches[0].clientX
          state.lastY = e.touches[0].clientY
          state.rotationY += dx * 0.01
          state.rotationX += dy * 0.01
          render()
        } else if (e.touches.length === 2) {
          const p = pinchDist(e)
          const delta = (state.lastPinch - p) * 0.002
          state.zoom = clamp(state.zoom + delta, 1.0, 6.0)
          state.lastPinch = p
          render()
        }
      }, { passive: false })
      canvas.addEventListener('touchend', () => { state.dragging = false })
    }

    async function resolveData(cfg) {
      let volumeUrl = cfg.volumeUrl
      let labelUrl = cfg.labelUrl
      if (cfg.studyId) {
        setStatus('????????...')
        const infoUrl = absUrl('/api/studies/' + encodeURIComponent(cfg.studyId) + '/model', cfg.gatewayUrl)
        const payload = await fetchJson(infoUrl, cfg.token)
        const model = payload && payload.code !== undefined ? payload.data : payload
        const volumeKeys = ['volumeUrl', 'volumePath', 'nrrdUrl', 'nrrdPath', 'modelPath', 'filePath', 'url']
        const labelKeys = ['labelUrl', 'labelPath', 'maskUrl', 'maskPath']
        volumeUrl = volumeKeys.map((k) => model && model[k]).find(Boolean) || volumeUrl
        labelUrl = labelKeys.map((k) => model && model[k]).find(Boolean) || labelUrl
        volumeUrl = absUrl(volumeUrl, cfg.gatewayUrl || cfg.modelUrl)
        labelUrl = absUrl(labelUrl, cfg.gatewayUrl || cfg.modelUrl)
      } else {
        volumeUrl = absUrl(volumeUrl, cfg.modelUrl || cfg.gatewayUrl)
        labelUrl = absUrl(labelUrl, cfg.modelUrl || cfg.gatewayUrl)
      }
      if (cfg.view === 'volume') labelUrl = ''
      if (cfg.view === 'label' && labelUrl) { volumeUrl = labelUrl; labelUrl = '' }
      return { volumeUrl, labelUrl }
    }

    async function bootstrap() {
      try {
        const cfg = parseQuery()
        initGL()
        bindControls()
        bindEvents()
        resize()

        const src = await resolveData(cfg)
        if (!src.volumeUrl) throw new Error('No volume source')

        setStatus('???????...')
        const [volumeBuf, labelBuf] = await Promise.all([
          fetchBuffer(src.volumeUrl, cfg.token),
          src.labelUrl ? fetchBuffer(src.labelUrl, cfg.token) : Promise.resolve(null)
        ])

        setStatus('???????...')
        const volume = await parseNrrd(volumeBuf)
        state.volumeData = volume
        state.labelData = null
        let label = null
        if (labelBuf) {
          setStatus('????????...')
          const maybeLabel = await parseNrrd(labelBuf)
          if (maybeLabel.dims.length >= 3 && maybeLabel.dims.every((v, i) => v === volume.dims[i])) {
            label = maybeLabel
            state.labelData = maybeLabel
          }
        }

        buildCloud(volume, label)
        setStatus('???????=' + state.pointCount)
      } catch (err) {
        console.error(err)
        setStatus('?????' + (err && err.message ? err.message : err))
      }
    }

    window.addEventListener('resize', resize)
    bootstrap()
  </script>
</body>
