checklist_id: QC_DEMO_HN_001
title: 头颈部靶区勾画同行评审检查清单（Demo）
doc_type: hospital_sop
disease_site: head_neck
version: demo_v1
effective_date: 2025-12-20
publisher: Demo (compiled)
access_level: qc
source_uri:
  - https://www.rcr.ac.uk/media/bpvngu2n/rcr-publications_radiotherapy-target-volume-definition-and-peer-review-second-edition-rcr-guidance_october-2022.pdf
notes: |
  Demo用途：把“同行评审/可审计流程”拆成勾选项，便于RAG按问题定位检查点。
items:
  - id: HN01
    item: "是否已查看并记录关键诊断影像（CT/MRI/PET-CT等）并确保与计划CT对齐/配准合理？"
    severity: high
    refs:
      - "RCR2022: Defining target volumes（强调使用可用影像、评估配准准确性）"
  - id: HN02
    item: "GTV是否覆盖可见/可证实的恶性病灶范围？是否存在明显遗漏风险？"
    severity: high
    refs:
      - "RCR2022: GTV 定义与遗漏风险"
  - id: HN03
    item: "CTV是否在GTV基础上合理覆盖潜在微小浸润路径，并考虑解剖屏障进行编辑？"
    severity: high
    refs:
      - "RCR2022: CTV 概念与“各向异性编辑”提示"
  - id: HN04
    item: "PTV margin是否符合部门/协议要求；如有个体化调整是否有记录依据？"
    severity: medium
    refs:
      - "RCR2022: PTV 与 margin 审计原则"
  - id: HN05
    item: "OAR/PRV 是否完整、命名规范、且关键结构已复核（必要时请影像科协助）？"
    severity: high
    refs:
      - "RCR2022: OAR 与质量保证强调"
  - id: HN06
    item: "同行评审结论是否按标准化模板记录（NO CHANGE / MINOR / MAJOR），并可追溯？"
    severity: medium
    refs:
      - "RCR2022: 标准化 peer review outcome record 模板建议"
